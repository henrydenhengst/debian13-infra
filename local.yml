---
# Debian 13 (trixie) desktop-provisioning, bedoeld voor ansible-pull.
#
# Vereist: community.general collection
#   sudo apt install ansible git      (het pakket 'ansible' bevat de collections)
#   of: ansible-galaxy collection install community.general
#
# Handmatig testen:
#   sudo ansible-playbook playbook.yml --check --diff -e desktop_user=jouwnaam
#
# Via ansible-pull (eenmalig):
#   sudo ansible-pull -U <repo-url> -i localhost, -o playbook.yml -e desktop_user=jouwnaam
#
# Automatisch dagelijks (systemd-timer, Play 5): geef pull_repo_url mee of vul hem hieronder in
#   sudo ansible-pull -U <repo-url> -i localhost, playbook.yml \
#        -e desktop_user=jouwnaam -e pull_repo_url=<repo-url>

# =============================================
# PLAY 1 — Basislijn
# =============================================
- name: Local baseline configuratie Debian 13
  hosts: localhost
  connection: local
  become: true

  tasks:
    - name: Basispakketten installeren
      ansible.builtin.apt:
        name:
          - curl
          - htop
          - unattended-upgrades
          - git
          - firefox-esr
          - anacron              # Zorgt dat periodieke taken ook draaien als de PC uit stond
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: MOTD plaatsen
      ansible.builtin.copy:
        src: files/motd.txt
        dest: /etc/motd
        owner: root
        group: root
        mode: "0644"

    - name: Firefox policies-directory aanmaken
      ansible.builtin.file:
        path: /etc/firefox/policies
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Firefox policies plaatsen (uBlock Origin + startpagina)
      ansible.builtin.copy:
        src: files/firefox/policies.json
        dest: /etc/firefox/policies/policies.json
        owner: root
        group: root
        mode: "0644"

    - name: Configureer unattended-upgrades
      ansible.builtin.copy:
        src: files/apt/52unattended-upgrades-local
        dest: /etc/apt/apt.conf.d/52unattended-upgrades-local
        owner: root
        group: root
        mode: "0644"
      notify: Herstart apt-daily timers

  handlers:
    - name: Herstart apt-daily timers
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: restarted
      loop:
        - apt-daily.timer
        - apt-daily-upgrade.timer

# =============================================
# PLAY 2 — Hardware support
# =============================================
- name: Hardware Support & Optimalisatie (Debian 13)
  hosts: localhost
  connection: local
  gather_facts: true
  become: true

  vars:
    # ansible-pull draait als root: geef de echte desktopgebruiker mee met -e desktop_user=naam
    desktop_user: freeboot
    # Hardware-rapport opnieuw maken als het ouder is dan dit aantal seconden (30 dagen)
    hw_report_max_age: 2592000

  tasks:
    # --- 1. REPOSITORIES (deb822-formaat van Debian 13) ---
    - name: Controleer of debian.sources bestaat
      ansible.builtin.stat:
        path: /etc/apt/sources.list.d/debian.sources
      register: debian_sources

    - name: Stop als de deb822-bronnen ontbreken
      ansible.builtin.fail:
        msg: >-
          /etc/apt/sources.list.d/debian.sources niet gevonden.
          Pas de repo-taak aan voor jouw situatie (bijv. klassieke sources.list).
      when: not debian_sources.stat.exists

    - name: Activeer contrib, non-free en non-free-firmware
      ansible.builtin.replace:
        path: /etc/apt/sources.list.d/debian.sources
        regexp: '^Components:.*$'
        replace: 'Components: main contrib non-free non-free-firmware'
      register: repo_added

    - name: Update apt cache na repo-wijziging
      ansible.builtin.apt:
        update_cache: true
      when: repo_added.changed

    # --- 2. CPU MICROCODE (dynamisch) ---
    - name: Installeer de juiste CPU microcode
      ansible.builtin.apt:
        name: "{{ 'intel-microcode' if 'GenuineIntel' in ansible_processor else 'amd64-microcode' }}"
        state: present

    # --- 3. CORE FIRMWARE & THERMAL ---
    - name: Installeer basis firmware
      ansible.builtin.apt:
        name:
          - firmware-misc-nonfree
        state: present

    - name: Installeer thermald (alleen Intel)
      ansible.builtin.apt:
        name: thermald
        state: present
      when: "'GenuineIntel' in ansible_processor"

    # --- 4. NETWERK & BLUETOOTH ---
    - name: Installeer Wi-Fi en Bluetooth drivers
      ansible.builtin.apt:
        name:
          - firmware-iwlwifi
          - firmware-brcm80211
          - firmware-realtek
          - firmware-atheros
          - bluez-firmware
          - bluetooth
        state: present

    # --- 5. GRAFISCH & INPUT ---
    - name: Installeer GPU versnelling en Touchpad support
      ansible.builtin.apt:
        name:
          - firmware-amd-graphics   # Onschadelijk op niet-AMD hardware
          - mesa-utils
          - va-driver-all
          - xserver-xorg-input-libinput
        state: present

    # --- 6. AUDIO & WEBCAM ---
    - name: Installeer Audio (SOF) en Webcam tools
      ansible.builtin.apt:
        name:
          - firmware-sof-signed
          - alsa-utils
          - guvcview
          - v4l-utils
        state: present

    # --- 7. BESTANDSSYSTEEM & SMARTCARD ---
    - name: Installeer NTFS, exFAT en Smartcard support
      ansible.builtin.apt:
        name:
          - ntfs-3g
          - exfatprogs
          - pcscd
          - pcsc-tools
          - opensc
        state: present

    - name: Zorg dat Smartcard service draait
      ansible.builtin.systemd:
        name: pcscd
        state: started
        enabled: true

    # --- 8. LAPTOP OPTIMALISATIE ---
    # TLP conflicteert met power-profiles-daemon
    - name: Verwijder power-profiles-daemon (conflicteert met TLP)
      ansible.builtin.apt:
        name: power-profiles-daemon
        state: absent

    - name: Installeer TLP voor batterijbeheer
      ansible.builtin.apt:
        name:
          - tlp
          - tlp-rdw
        state: present

    - name: Start TLP service
      ansible.builtin.systemd:
        name: tlp
        state: started
        enabled: true

    # --- 9. GEBRUIKERSRECHTEN ---
    - name: Zorg dat hardware-groepen bestaan
      ansible.builtin.group:
        name: "{{ item }}"
        state: present
        system: true
      loop:
        - video
        - lp
        - plugdev
        - bluetooth
        - audio

    - name: Voeg desktopgebruiker toe aan hardware-groepen
      ansible.builtin.user:
        name: "{{ desktop_user }}"
        groups: video,lp,plugdev,bluetooth,audio
        append: true

    # --- 10. HARDWARE-GEZONDHEIDSRAPPORT (eens per 30 dagen) ---
    - name: Installeer diagnose-tools
      ansible.builtin.apt:
        name:
          - lshw
          - smartmontools
          - inxi
          - upower
          - mokutil
          - dmidecode
        state: present

    - name: Kijk of het hardware-rapport al bestaat
      ansible.builtin.stat:
        path: "/home/{{ desktop_user }}/FreeBoot-hardware-rapport.txt"
      register: hw_report

    - name: Voer hardware-controles uit
      ansible.builtin.shell:
        cmd: "( {{ item.cmd }} ) 2>&1"
        executable: /bin/bash
      loop: "{{ hw_checks }}"
      loop_control:
        label: "{{ item.titel }}"
      register: hw_results
      changed_when: false
      failed_when: false
      when: >-
        not hw_report.stat.exists or
        (ansible_date_time.epoch | int - hw_report.stat.mtime | int) > hw_report_max_age
      vars:
        hw_checks:
          - titel: ACCU STATUS (HOOFDACCU)
            cmd: |
              BAT=$(upower -e | grep battery | head -n 1)
              if [ -z "$BAT" ]; then echo "Geen accu gevonden."; else upower -i "$BAT"; fi

          - titel: CMOS / INTERNE KLOK
            cmd: |
              timedatectl
              echo
              echo "--- Tijdsynchronisatie bij opstarten ---"
              journalctl -b 0 --no-pager | grep -i "systemd-timesyncd" | grep "Interval" -A 2 \
                || echo "Geen grote tijdsprongen gedetecteerd in deze sessie."

          - titel: SSD GEZONDHEID (SMART)
            cmd: |
              DISKS=$(lsblk -dpno NAME,TYPE | awk '$2=="disk"{print $1}' | grep -v zram)
              if [ -z "$DISKS" ]; then echo "Geen schijf gevonden voor SMART."; fi
              for d in $DISKS; do
                echo "== $d"
                smartctl -H "$d"
                echo "Kritieke parameters:"
                smartctl -A "$d" | grep -iE 'reallocated|wear|pending|exhaustion|percentage|spare' || true
              done

          - titel: HARDWARE FOUTMELDINGEN (DMESG)
            cmd: |
              dmesg | grep -iE 'error|critical|fail|acpi|voltage|low battery|rtc' | tail -n 25

          - titel: BIOS INFORMATIE
            cmd: |
              dmidecode -t bios | grep -E "Vendor|Version|Release Date"

          - titel: SECURE BOOT STATUS
            cmd: |
              mokutil --sb-state

          - titel: SYSTEEM OVERZICHT (INXI)
            cmd: |
              inxi -Fxz

          - titel: HARDWARE DETAILS (LSHW)
            cmd: |
              lshw

    - name: Schrijf rapport weg in de home-directory
      ansible.builtin.copy:
        content: |
          --- Uitgebreid Hardware Gezondheidsrapport ---
          Gegenereerd op: {{ ansible_date_time.iso8601 }}
          ----------------------------------------------
          {% for r in hw_results.results %}

          ### {{ r.item.titel }} ###
          {{ r.stdout }}
          {% endfor %}
        dest: "/home/{{ desktop_user }}/FreeBoot-hardware-rapport.txt"
        owner: "{{ desktop_user }}"
        group: "{{ desktop_user }}"
        mode: "0644"
      when: >-
        not hw_report.stat.exists or
        (ansible_date_time.epoch | int - hw_report.stat.mtime | int) > hw_report_max_age

# =============================================
# PLAY 3 — Cinnamon desktop & essentials
# =============================================
- name: Cinnamon desktopomgeving en essentiële applicaties
  hosts: localhost
  connection: local
  become: true

  vars:
    # Pas de URL aan zodra je de nieuwe, grotere wallpaper hebt (bij voorkeur 3840x2160)
    wallpaper_url: https://freeboot.nl/images/wallpaper.webp
    wallpaper_dest: /usr/share/backgrounds/freeboot/wallpaper.webp
    # Zet op true om SSH-verkeer (poort 22) toe te staan; installeer dan ook openssh-server
    ufw_allow_ssh: false

  tasks:
    # --- 1. XORG + LIGHTDM ---
    # Debconf moet VOOR de installatie van lightdm staan
    - name: Kies LightDM als standaard display manager (debconf)
      ansible.builtin.debconf:
        name: lightdm
        question: shared/default-x-display-manager
        vtype: select
        value: /usr/sbin/lightdm

    - name: Installeer Xorg en LightDM
      ansible.builtin.apt:
        name:
          - xserver-xorg
          - xinit
          - lightdm
          - slick-greeter
        state: present

    - name: Zorg dat lightdm.conf.d directory bestaat
      ansible.builtin.file:
        path: /etc/lightdm/lightdm.conf.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Configureer slick-greeter als LightDM greeter
      ansible.builtin.copy:
        content: |
          [Seat:*]
          greeter-session=slick-greeter
        dest: /etc/lightdm/lightdm.conf.d/50-slick-greeter.conf
        owner: root
        group: root
        mode: "0644"

    # --- 2. CINNAMON ---
    - name: Installeer Cinnamon desktop
      ansible.builtin.apt:
        name:
          - cinnamon
          - cinnamon-l10n
          - network-manager-gnome
          - gnome-terminal
          - nemo
          - gvfs-fuse                  # Prullenbak en externe schijven in Nemo
          - gstreamer1.0-plugins-good  # Audio/video previews
        state: present

    # --- 3. AUDIO (PipeWire) ---
    - name: Installeer PipeWire audio-stack
      ansible.builtin.apt:
        name:
          - pipewire
          - pipewire-audio
          - wireplumber
          - pavucontrol
        state: present

    # --- 4. FONTS ---
    - name: Installeer basisfonts
      ansible.builtin.apt:
        name:
          - fonts-dejavu
          - fonts-noto
          - fonts-liberation
        state: present

    - name: Accepteer Microsoft EULA voor ttf-mscorefonts
      ansible.builtin.debconf:
        name: ttf-mscorefonts-installer
        question: msttcorefonts/accepted-mscorefonts-eula
        vtype: boolean
        value: "true"

    # Let op: de MS-fonts worden van SourceForge gedownload en dat faalt soms.
    - name: Installeer Microsoft-kernfonts en vrije alternatieven
      ansible.builtin.apt:
        name:
          - ttf-mscorefonts-installer
          - fonts-crosextra-carlito
          - fonts-crosextra-caladea
        state: present

    # --- 5. ESSENTIËLE APPLICATIES ---
    - name: Installeer kantoor- en document-applicaties
      ansible.builtin.apt:
        name:
          - libreoffice
          - libreoffice-gtk3
          - libreoffice-l10n-nl
          - evince
        state: present

    # --- 6. CLI-TOOLS (git, htop, curl staan al in Play 1) ---
    - name: Installeer CLI-tools
      ansible.builtin.apt:
        name:
          - git
          - vim
          - htop
          - curl
          - wget
        state: present

    # --- 7. ARCHIEFTOOLS (zonder RAR) ---
    - name: Installeer archiveringstools
      ansible.builtin.apt:
        name:
          - zip
          - unzip
          - 7zip
          - xz-utils
          - zstd
          - cabextract
          - arj
          - lhasa
        state: present

    # --- 8. SECURITY: APPARMOR ---
    - name: Installeer AppArmor (userspace tools + extra profielen)
      ansible.builtin.apt:
        name:
          - apparmor
          - apparmor-profiles
          - apparmor-utils
        state: present

    - name: Zorg dat AppArmor actief is
      ansible.builtin.systemd:
        name: apparmor
        state: started
        enabled: true

    # --- 9. SECURITY: UFW FIREWALL ---
    - name: Installeer UFW
      ansible.builtin.apt:
        name: ufw
        state: present

    - name: Stel standaard inkomend beleid in op 'deny'
      community.general.ufw:
        default: deny
        direction: incoming

    - name: Stel standaard uitgaand beleid in op 'allow'
      community.general.ufw:
        default: allow
        direction: outgoing

    # Standaard uit: er is geen SSH-server geïnstalleerd. Zet ufw_allow_ssh: true om te openen.
    - name: Sta SSH toe (poort 22)
      community.general.ufw:
        rule: allow
        port: "22"
        proto: tcp
      when: ufw_allow_ssh | bool

    - name: Schakel de UFW-firewall in
      community.general.ufw:
        state: enabled

    # --- 10. NICE-TO-HAVES ---
    - name: Installeer extra handige tools
      ansible.builtin.apt:
        name:
          - fwupd                  # Firmware-updates via LVFS (BIOS, SSD)
          - timeshift              # Systeem-backups voor je desktop
          - gnome-keyring          # Wachtwoordbeheer voor browsers/apps
          - libpam-gnome-keyring   # Ontgrendelt de keyring automatisch bij inloggen
          - needrestart            # Waarschuwt welke services herstart moeten
        state: present

    - name: Needrestart niet-interactief maken (automatisch herstarten)
      ansible.builtin.copy:
        content: |
          $nrconf{restart} = 'a';
        dest: /etc/needrestart/conf.d/50-autorestart.conf
        owner: root
        group: root
        mode: "0644"

    # --- 11. LIGHTDM ACTIVEREN ---
    # Alleen enablen: starten/herstarten zou de lopende sessie afkappen.
    # LightDM start vanzelf na de volgende reboot.
    - name: Activeer LightDM bij opstarten
      ansible.builtin.systemd:
        name: lightdm
        enabled: true

    # --- 12. WALLPAPER ---
    - name: Installeer dconf-tools en webp-ondersteuning
      ansible.builtin.apt:
        name:
          - dconf-cli
          - webp-pixbuf-loader   # Nodig om .webp als achtergrond te tonen
        state: present

    - name: Maak wallpaper-directory aan
      ansible.builtin.file:
        path: /usr/share/backgrounds/freeboot
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Download wallpaper
      ansible.builtin.get_url:
        url: "{{ wallpaper_url }}"
        dest: "{{ wallpaper_dest }}"
        owner: root
        group: root
        mode: "0644"
        force: true   # Haalt een nieuwe versie op als de afbeelding online is gewijzigd

    - name: Zorg dat dconf een systeemdatabase gebruikt
      ansible.builtin.copy:
        content: |
          user-db:user
          system-db:local
        dest: /etc/dconf/profile/user
        owner: root
        group: root
        mode: "0644"

    - name: Zorg dat dconf local.d directory bestaat
      ansible.builtin.file:
        path: /etc/dconf/db/local.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Stel wallpaper in als Cinnamon-standaard
      ansible.builtin.copy:
        content: |
          [org/cinnamon/desktop/background]
          picture-uri='file://{{ wallpaper_dest }}'
          picture-options='zoom'
        dest: /etc/dconf/db/local.d/00-wallpaper
        owner: root
        group: root
        mode: "0644"
      register: dconf_wallpaper

    - name: Werk de dconf-database bij
      ansible.builtin.command: dconf update
      when: dconf_wallpaper is changed

    - name: Zet dezelfde wallpaper op het inlogscherm (slick-greeter)
      ansible.builtin.copy:
        content: |
          [Greeter]
          background={{ wallpaper_dest }}
        dest: /etc/lightdm/slick-greeter.conf
        owner: root
        group: root
        mode: "0644"

# =============================================
# PLAY 4 — Dagelijks gebruik
# =============================================
- name: Dagelijkse gebruikerslaag
  hosts: localhost
  connection: local
  become: true

  tasks:
    # --- 1. PRINTEN (driverless) ---
    - name: Installeer CUPS en moderne driverless printing
      ansible.builtin.apt:
        name:
          - cups
          - avahi-daemon      # mDNS discovery voor netwerkprinters
          - ipp-usb           # Driverless printing voor USB-printers
          - system-config-printer
        state: present

    - name: Zorg dat CUPS draait
      ansible.builtin.systemd:
        name: cups
        state: started
        enabled: true

    - name: Zorg dat Avahi draait (netwerkprinterdetectie)
      ansible.builtin.systemd:
        name: avahi-daemon
        state: started
        enabled: true

    # --- 2. BLUETOOTH GUI ---
    - name: Installeer Blueman
      ansible.builtin.apt:
        name: blueman
        state: present

    # --- 3. MEDIA ---
    - name: Installeer VLC
      ansible.builtin.apt:
        name:
          - vlc
          - vlc-l10n
        state: present

    # --- 4. WACHTWOORDKLUIS ---
    - name: Installeer KeePassXC
      ansible.builtin.apt:
        name: keepassxc
        state: present

    # --- 5. SCREENSHOTS ---
    - name: Installeer Flameshot
      ansible.builtin.apt:
        name: flameshot
        state: present

    # --- 6. ARCHIEF-GUI ---
    - name: Installeer File Roller
      ansible.builtin.apt:
        name: file-roller
        state: present

    # --- 7. SIGNAL DESKTOP (eigen repository, alleen amd64) ---
    - name: Installeer gnupg (nodig om de Signal-sleutel te dearmoren)
      ansible.builtin.apt:
        name: gnupg
        state: present
      when: ansible_architecture == "x86_64"

    - name: Download Signal signing key
      ansible.builtin.get_url:
        url: https://updates.signal.org/desktop/apt/keys.asc
        dest: /tmp/signal-desktop-keys.asc
        mode: "0644"
      when: ansible_architecture == "x86_64"

    - name: Zet Signal signing key om naar keyring
      ansible.builtin.command:
        cmd: gpg --dearmor --output /usr/share/keyrings/signal-desktop-keyring.gpg /tmp/signal-desktop-keys.asc
        creates: /usr/share/keyrings/signal-desktop-keyring.gpg
      when: ansible_architecture == "x86_64"

    - name: Voeg Signal repository toe
      ansible.builtin.get_url:
        url: https://updates.signal.org/static/desktop/apt/signal-desktop.sources
        dest: /etc/apt/sources.list.d/signal-desktop.sources
        owner: root
        group: root
        mode: "0644"
        force: true
      register: signal_repo
      when: ansible_architecture == "x86_64"

    - name: Update apt cache na toevoegen Signal repository
      ansible.builtin.apt:
        update_cache: true
      when: signal_repo is changed

    - name: Installeer Signal Desktop
      ansible.builtin.apt:
        name: signal-desktop
        state: present
      when: ansible_architecture == "x86_64"

# =============================================
# PLAY 5 — ansible-pull automatisering (systemd-timer)
# =============================================
# Wordt alleen uitgevoerd als pull_repo_url is ingevuld.
- name: Ansible-pull dagelijks automatisch uitvoeren
  hosts: localhost
  connection: local
  become: true

  vars:
    desktop_user: freeboot
    pull_repo_url: ""            # bijv. https://github.com/jij/repo.git (of geef mee met -e)
    pull_branch: main
    pull_playbook: playbook.yml
    pull_on_calendar: daily      # systemd OnCalendar-formaat

  tasks:
    - name: Installeer ansible en git
      ansible.builtin.apt:
        name:
          - ansible
          - git
        state: present
      when: pull_repo_url | length > 0

    - name: Plaats ansible-pull service
      ansible.builtin.copy:
        content: |
          [Unit]
          Description=Ansible-pull configuratie-update
          Wants=network-online.target
          After=network-online.target

          [Service]
          Type=oneshot
          TimeoutStartSec=3h
          ExecStart=/usr/bin/ansible-pull -U {{ pull_repo_url }} -C {{ pull_branch }} -i localhost, -o {{ pull_playbook }} -e desktop_user={{ desktop_user }}
        dest: /etc/systemd/system/ansible-pull.service
        owner: root
        group: root
        mode: "0644"
      when: pull_repo_url | length > 0

    - name: Plaats ansible-pull timer
      ansible.builtin.copy:
        content: |
          [Unit]
          Description=Ansible-pull periodiek uitvoeren

          [Timer]
          OnBootSec=15min
          OnCalendar={{ pull_on_calendar }}
          Persistent=true
          RandomizedDelaySec=30min

          [Install]
          WantedBy=timers.target
        dest: /etc/systemd/system/ansible-pull.timer
        owner: root
        group: root
        mode: "0644"
      when: pull_repo_url | length > 0

    - name: Activeer en start de ansible-pull timer
      ansible.builtin.systemd:
        name: ansible-pull.timer
        enabled: true
        state: started
        daemon_reload: true
      when: pull_repo_url | length > 0
