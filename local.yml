---
# =============================================
# PLAY 1 — Basislijn
# =============================================
- name: Local baseline configuratie Debian 13
  hosts: localhost
  connection: local
  become: true

  tasks:
    - name: Basispakketten installeren
      ansible.builtin.apt:
        name:
          - curl
          - htop
          - unattended-upgrades
          - git
          - firefox-esr
        state: present
        update_cache: true

    - name: MOTD plaatsen
      ansible.builtin.copy:
        src: files/motd.txt
        dest: /etc/motd
        owner: root
        group: root
        mode: "0644"

    - name: Firefox policies-directory aanmaken
      ansible.builtin.file:
        path: /etc/firefox/policies
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Firefox policies plaatsen (uBlock Origin + startpagina)
      ansible.builtin.copy:
        src: files/firefox/policies.json
        dest: /etc/firefox/policies/policies.json
        owner: root
        group: root
        mode: "0644"

    - name: Configureer unattended-upgrades
      ansible.builtin.copy:
        src: files/apt/52unattended-upgrades-local
        dest: /etc/apt/apt.conf.d/52unattended-upgrades-local
        owner: root
        group: root
        mode: "0644"
      notify: Herstart apt-daily timers

  handlers:
    - name: Herstart apt-daily timers
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: restarted
      loop:
        - apt-daily.timer
        - apt-daily-upgrade.timer

# =============================================
# PLAY 2 — Hardware support
# =============================================
- name: Hardware Support & Optimalisatie (Debian 13)
  hosts: localhost
  connection: local
  gather_facts: yes
  become: yes

  tasks:
    # --- 1. REPOSITORIES ---
    - name: Activeer contrib, non-free en non-free-firmware
      ansible.builtin.apt_repository:
        repo: "deb http://deb.debian.org/debian/ {{ ansible_distribution_release }} main contrib non-free non-free-firmware"
        state: present
      register: repo_added

    - name: Update cache als repo is toegevoegd
      ansible.builtin.apt:
        update_cache: yes
      when: repo_added.changed

    # --- 2. CPU MICROCODE (Dynamisch) ---
    - name: Installeer de juiste CPU microcode
      ansible.builtin.apt:
        name: "{{ 'intel-microcode' if 'GenuineIntel' in ansible_processor[2] else 'amd64-microcode' }}"
        state: present

    # --- 3. CORE FIRMWARE & THERMAL ---
    - name: Installeer basis firmware en thermisch beheer
      ansible.builtin.apt:
        name:
          - firmware-misc-nonfree
          - thermald
        state: present

    # --- 4. NETWERK & BLUETOOTH ---
    - name: Installeer Wi-Fi en Bluetooth drivers
      ansible.builtin.apt:
        name:
          - firmware-iwlwifi
          - firmware-brcm80211
          - firmware-realtek
          - firmware-atheros
          - bluez-firmware
          - bluetooth
        state: present

    # --- 5. GRAFISCH & INPUT ---
    - name: Installeer GPU versnelling en Touchpad support
      ansible.builtin.apt:
        name:
          - firmware-amd-graphics
          - mesa-utils
          - va-driver-all
          - xserver-xorg-input-libinput
        state: present

    # --- 6. AUDIO & WEBCAM ---
    - name: Installeer Audio (SOF) en Webcam tools
      ansible.builtin.apt:
        name:
          - firmware-sof-signed
          - alsa-utils
          - guvcview
          - v4l-utils
        state: present

    # --- 7. BESTANDSSYSTEEM & SMARTCARD ---
    - name: Installeer NTFS, exFAT en Smartcard support
      ansible.builtin.apt:
        name:
          - ntfs-3g
          - exfatprogs
          - pcscd
          - pcsc-tools
          - opensc
        state: present

    - name: Zorg dat Smartcard service draait
      ansible.builtin.systemd:
        name: pcscd
        state: started
        enabled: yes

    # --- 8. LAPTOP OPTIMALISATIE ---
    - name: Installeer TLP voor batterijbeheer
      ansible.builtin.apt:
        name:
          - tlp
          - tlp-rdw
        state: present

    - name: Start TLP service
      ansible.builtin.systemd:
        name: tlp
        state: started
        enabled: yes

    # --- 9. GEBRUIKERSRECHTEN ---
    - name: Voeg desktopgebruiker toe aan hardware-groepen
      ansible.builtin.user:
        name: "{{ ansible_env.SUDO_USER | default('henry') }}"
        groups: video,lp,plugdev,bluetooth,audio
        append: true


# =============================================
# PLAY 3 — Cinnamon desktop & essentials
# =============================================
- name: Cinnamon desktopomgeving en essentiële applicaties
  hosts: localhost
  connection: local
  become: true

  tasks:
    # --- 1. XORG + LIGHTDM ---
    - name: Installeer Xorg en LightDM
      ansible.builtin.apt:
        name:
          - xserver-xorg
          - xinit
          - lightdm
          - lightdm-gtk-greeter
          - slick-greeter        # Mooiere greeter, past bij Cinnamon
        state: present

    - name: Zet LightDM als standaard display manager
      ansible.builtin.debconf:
        name: lightdm
        question: shared/default-x-display-manager
        vtype: select
        value: lightdm

    # --- 2. CINNAMON ---
    - name: Installeer Cinnamon desktop
      ansible.builtin.apt:
        name:
          - cinnamon
          - cinnamon-l10n
          - cinnamon-core
          - network-manager-gnome
          - gnome-terminal
          - nemo
        state: present

    # --- 3. AUDIO (PipeWire) ---
    - name: Installeer PipeWire audio-stack
      ansible.builtin.apt:
        name:
          - pipewire
          - pipewire-audio
          - wireplumber
          - pavucontrol
        state: present

    # --- 4. FONTS ---
    - name: Installeer basisfonts
      ansible.builtin.apt:
        name:
          - fonts-dejavu
          - fonts-noto
          - fonts-liberation
        state: present

    # --- 5. ESSENTIËLE APPLICATIES ---
    - name: Installeer kantoor- en document-applicaties
      ansible.builtin.apt:
        name:
          - libreoffice
          - libreoffice-gtk3       # Betere integratie met Cinnamon
          - evince
        state: present

    # --- 6. CLI-TOOLS ---
    - name: Installeer CLI-tools
      ansible.builtin.apt:
        name:
          - git
          - vim
          - htop
          - curl
          - wget
        state: present

    # --- 7. ARCHIEFTOOLS (Debian 13-correct) ---
    - name: Installeer archiveringstools
      ansible.builtin.apt:
        name:
          - zip
          - unzip
          - 7zip                 # Vervanger van p7zip-full in Debian 13
          - xz-utils
          - zstd
          - unrar-free
          - cabextract
          - arj
          - lhasa                # Vervanger van lha
        state: present

    # --- 8. LIGHTDM ACTIVEREN ---
    - name: Activeer en start LightDM
      ansible.builtin.systemd:
        name: lightdm
        state: started
        enabled: yes