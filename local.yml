---
- name: Local baseline configuratie Debian 13
  hosts: localhost
  connection: local
  become: true

  tasks:
    - name: Basispakketten installeren
      ansible.builtin.apt:
        name:
          - curl
          - htop
          - unattended-upgrades
          - git
          - firefox-esr
        state: present
        update_cache: true

    - name: MOTD plaatsen
      ansible.builtin.copy:
        src: files/motd.txt
        dest: /etc/motd
        owner: root
        group: root
        mode: "0644"

    - name: Firefox policies-directory aanmaken
      ansible.builtin.file:
        path: /etc/firefox/policies
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Firefox policies plaatsen (uBlock Origin + startpagina)
      ansible.builtin.copy:
        src: files/firefox/policies.json
        dest: /etc/firefox/policies/policies.json
        owner: root
        group: root
        mode: "0644"