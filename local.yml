---
- name: Local baseline configuratie Debian 13
  hosts: localhost
  connection: local
  become: true

  tasks:
    - name: Basispakketten installeren
      ansible.builtin.apt:
        name:
          - curl
          - htop
          - unattended-upgrades
          - git
          - firefox-esr
        state: present
        update_cache: true

    - name: MOTD plaatsen
      ansible.builtin.copy:
        src: files/motd.txt
        dest: /etc/motd
        owner: root
        group: root
        mode: "0644"

    - name: Firefox policies-directory aanmaken
      ansible.builtin.file:
        path: /etc/firefox/policies
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Firefox policies plaatsen (uBlock Origin + startpagina)
      ansible.builtin.copy:
        src: files/firefox/policies.json
        dest: /etc/firefox/policies/policies.json
        owner: root
        group: root
        mode: "0644"

  - name: Configureer unattended-upgrades voor stille achtergrondupdates
    ansible.builtin.copy:
      src: files/apt/52unattended-upgrades-local
      dest: /etc/apt/apt.conf.d/52unattended-upgrades-local
      owner: root
      group: root
      mode: '0644'
    notify: Herstart apt-daily timers

handlers:
  - name: Herstart apt-daily timers
    ansible.builtin.systemd:
      name: "{{ item }}"
      state: restarted
      daemon_reload: true
    loop:
      - apt-daily.timer
      - apt-daily-upgrade.timer