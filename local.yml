---
# Vereist: community.general collection
#   sudo apt install ansible        (bevat de collections)
#   of: ansible-galaxy collection install community.general
#
# Gebruik:
#   ansible-playbook playbook.yml --check --diff
#   ansible-playbook playbook.yml -e desktop_user=jouwnaam

# =============================================
# PLAY 1 — Basislijn
# =============================================
- name: Local baseline configuratie Debian 13
  hosts: localhost
  connection: local
  become: true

  tasks:
    - name: Basispakketten installeren
      ansible.builtin.apt:
        name:
          - curl
          - htop
          - unattended-upgrades
          - git
          - firefox-esr
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: MOTD plaatsen
      ansible.builtin.copy:
        src: files/motd.txt
        dest: /etc/motd
        owner: root
        group: root
        mode: "0644"

    - name: Firefox policies-directory aanmaken
      ansible.builtin.file:
        path: /etc/firefox/policies
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Firefox policies plaatsen (uBlock Origin + startpagina)
      ansible.builtin.copy:
        src: files/firefox/policies.json
        dest: /etc/firefox/policies/policies.json
        owner: root
        group: root
        mode: "0644"

    - name: Configureer unattended-upgrades
      ansible.builtin.copy:
        src: files/apt/52unattended-upgrades-local
        dest: /etc/apt/apt.conf.d/52unattended-upgrades-local
        owner: root
        group: root
        mode: "0644"
      notify: Herstart apt-daily timers

  handlers:
    - name: Herstart apt-daily timers
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: restarted
      loop:
        - apt-daily.timer
        - apt-daily-upgrade.timer

# =============================================
# PLAY 2 — Hardware support
# =============================================
- name: Hardware Support & Optimalisatie (Debian 13)
  hosts: localhost
  connection: local
  gather_facts: true
  become: true

  vars:
    desktop_user: freeboot

  tasks:
    # --- 1. REPOSITORIES (deb822-formaat van Debian 13) ---
    - name: Controleer of debian.sources bestaat
      ansible.builtin.stat:
        path: /etc/apt/sources.list.d/debian.sources
      register: debian_sources

    - name: Stop als de deb822-bronnen ontbreken
      ansible.builtin.fail:
        msg: >-
          /etc/apt/sources.list.d/debian.sources niet gevonden.
          Pas de repo-taak aan voor jouw situatie (bijv. klassieke sources.list).
      when: not debian_sources.stat.exists

    - name: Activeer contrib, non-free en non-free-firmware
      ansible.builtin.replace:
        path: /etc/apt/sources.list.d/debian.sources
        regexp: '^Components:.*$'
        replace: 'Components: main contrib non-free non-free-firmware'
      register: repo_added

    - name: Update apt cache na repo-wijziging
      ansible.builtin.apt:
        update_cache: true
      when: repo_added.changed

    # --- 2. CPU MICROCODE (dynamisch) ---
    - name: Installeer de juiste CPU microcode
      ansible.builtin.apt:
        name: "{{ 'intel-microcode' if 'GenuineIntel' in ansible_processor else 'amd64-microcode' }}"
        state: present

    # --- 3. CORE FIRMWARE & THERMAL ---
    - name: Installeer basis firmware
      ansible.builtin.apt:
        name:
          - firmware-misc-nonfree
        state: present

    - name: Installeer thermald (alleen Intel)
      ansible.builtin.apt:
        name: thermald
        state: present
      when: "'GenuineIntel' in ansible_processor"

    # --- 4. NETWERK & BLUETOOTH ---
    - name: Installeer Wi-Fi en Bluetooth drivers
      ansible.builtin.apt:
        name:
          - firmware-iwlwifi
          - firmware-brcm80211
          - firmware-realtek
          - firmware-atheros
          - bluez-firmware
          - bluetooth
        state: present

    # --- 5. GRAFISCH & INPUT ---
    - name: Installeer GPU versnelling en Touchpad support
      ansible.builtin.apt:
        name:
          - firmware-amd-graphics   # Onschadelijk op niet-AMD hardware
          - mesa-utils
          - va-driver-all
          - xserver-xorg-input-libinput
        state: present

    # --- 6. AUDIO & WEBCAM ---
    - name: Installeer Audio (SOF) en Webcam tools
      ansible.builtin.apt:
        name:
          - firmware-sof-signed
          - alsa-utils
          - guvcview
          - v4l-utils
        state: present

    # --- 7. BESTANDSSYSTEEM & SMARTCARD ---
    - name: Installeer NTFS, exFAT en Smartcard support
      ansible.builtin.apt:
        name:
          - ntfs-3g
          - exfatprogs
          - pcscd
          - pcsc-tools
          - opensc
        state: present

    - name: Zorg dat Smartcard service draait
      ansible.builtin.systemd:
        name: pcscd
        state: started
        enabled: true

    # --- 8. LAPTOP OPTIMALISATIE ---
    # TLP conflicteert met power-profiles-daemon
    - name: Verwijder power-profiles-daemon (conflicteert met TLP)
      ansible.builtin.apt:
        name: power-profiles-daemon
        state: absent

    - name: Installeer TLP voor batterijbeheer
      ansible.builtin.apt:
        name:
          - tlp
          - tlp-rdw
        state: present

    - name: Start TLP service
      ansible.builtin.systemd:
        name: tlp
        state: started
        enabled: true

    # --- 9. GEBRUIKERSRECHTEN ---
    - name: Zorg dat hardware-groepen bestaan
      ansible.builtin.group:
        name: "{{ item }}"
        state: present
        system: true
      loop:
        - video
        - lp
        - plugdev
        - bluetooth
        - audio

    - name: Voeg desktopgebruiker toe aan hardware-groepen
      ansible.builtin.user:
        name: "{{ desktop_user }}"
        groups: video,lp,plugdev,bluetooth,audio
        append: true

# =============================================
# PLAY 3 — Cinnamon desktop & essentials
# =============================================
- name: Cinnamon desktopomgeving en essentiële applicaties
  hosts: localhost
  connection: local
  become: true

  tasks:
    # --- 1. XORG + LIGHTDM ---
    # Debconf moet VOOR de installatie van lightdm staan
    - name: Kies LightDM als standaard display manager (debconf)
      ansible.builtin.debconf:
        name: lightdm
        question: shared/default-x-display-manager
        vtype: select
        value: /usr/sbin/lightdm

    - name: Installeer Xorg en LightDM
      ansible.builtin.apt:
        name:
          - xserver-xorg
          - xinit
          - lightdm
          - slick-greeter
        state: present

    - name: Zorg dat lightdm.conf.d directory bestaat
      ansible.builtin.file:
        path: /etc/lightdm/lightdm.conf.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Configureer slick-greeter als LightDM greeter
      ansible.builtin.copy:
        content: |
          [Seat:*]
          greeter-session=slick-greeter
        dest: /etc/lightdm/lightdm.conf.d/50-slick-greeter.conf
        owner: root
        group: root
        mode: "0644"

    # --- 2. CINNAMON ---
    - name: Installeer Cinnamon desktop
      ansible.builtin.apt:
        name:
          - cinnamon
          - cinnamon-l10n
          - network-manager-gnome
          - gnome-terminal
          - nemo
          - gvfs-fuse                  # Prullenbak en externe schijven in Nemo
          - gstreamer1.0-plugins-good  # Audio/video previews
        state: present

    # --- 3. AUDIO (PipeWire) ---
    - name: Installeer PipeWire audio-stack
      ansible.builtin.apt:
        name:
          - pipewire
          - pipewire-audio
          - wireplumber
          - pavucontrol
        state: present

    # --- 4. FONTS ---
    - name: Installeer basisfonts
      ansible.builtin.apt:
        name:
          - fonts-dejavu
          - fonts-noto
          - fonts-liberation
        state: present

    - name: Accepteer Microsoft EULA voor ttf-mscorefonts
      ansible.builtin.debconf:
        name: ttf-mscorefonts-installer
        question: msttcorefonts/accepted-mscorefonts-eula
        vtype: boolean
        value: "true"

    # Let op: de MS-fonts worden van SourceForge gedownload en dat faalt soms.
    - name: Installeer Microsoft-kernfonts en vrije alternatieven
      ansible.builtin.apt:
        name:
          - ttf-mscorefonts-installer
          - fonts-crosextra-carlito
          - fonts-crosextra-caladea
        state: present

    # --- 5. ESSENTIËLE APPLICATIES ---
    - name: Installeer kantoor- en document-applicaties
      ansible.builtin.apt:
        name:
          - libreoffice
          - libreoffice-gtk3
          - libreoffice-l10n-nl
          - evince
        state: present

    # --- 6. CLI-TOOLS (git, htop, curl staan al in Play 1) ---
    - name: Installeer CLI-tools
      ansible.builtin.apt:
        name:
          - vim
          - wget
        state: present

    # --- 7. ARCHIEFTOOLS (zonder RAR) ---
    - name: Installeer archiveringstools
      ansible.builtin.apt:
        name:
          - zip
          - unzip
          - 7zip
          - xz-utils
          - zstd
          - cabextract
          - arj
          - lhasa
        state: present

    # --- 8. SECURITY: APPARMOR ---
    - name: Installeer AppArmor (userspace tools + extra profielen)
      ansible.builtin.apt:
        name:
          - apparmor
          - apparmor-profiles
          - apparmor-utils
        state: present

    - name: Zorg dat AppArmor actief is
      ansible.builtin.systemd:
        name: apparmor
        state: started
        enabled: true

    # --- 9. SECURITY: UFW FIREWALL ---
    - name: Installeer UFW
      ansible.builtin.apt:
        name: ufw
        state: present

    - name: Stel standaard inkomend beleid in op 'deny'
      community.general.ufw:
        default: deny
        direction: incoming

    - name: Stel standaard uitgaand beleid in op 'allow'
      community.general.ufw:
        default: allow
        direction: outgoing

    # Geen SSH-regel: er is geen SSH-server geïnstalleerd.
    # Wil je SSH? Installeer openssh-server en voeg een allow-regel voor poort 22 toe.

    - name: Schakel de UFW-firewall in
      community.general.ufw:
        state: enabled

    # --- 10. NICE-TO-HAVES ---
    - name: Installeer extra handige tools
      ansible.builtin.apt:
        name:
          - fwupd                  # Firmware-updates via LVFS (BIOS, SSD)
          - timeshift              # Systeem-backups voor je desktop
          - gnome-keyring          # Wachtwoordbeheer voor browsers/apps
          - libpam-gnome-keyring   # Ontgrendelt de keyring automatisch bij inloggen
          - needrestart            # Waarschuwt welke services herstart moeten
        state: present

    - name: Needrestart niet-interactief maken (automatisch herstarten)
      ansible.builtin.copy:
        content: |
          $nrconf{restart} = 'a';
        dest: /etc/needrestart/conf.d/50-autorestart.conf
        owner: root
        group: root
        mode: "0644"

    # --- 11. LIGHTDM ACTIVEREN ---
    # Alleen enablen: starten/herstarten zou de lopende sessie afkappen.
    # LightDM start vanzelf na de volgende reboot.
    - name: Activeer LightDM bij opstarten
      ansible.builtin.systemd:
        name: lightdm
        enabled: true

# =============================================
# PLAY 4 — Dagelijks gebruik
# =============================================
- name: Dagelijkse gebruikerslaag
  hosts: localhost
  connection: local
  become: true

  tasks:
    # --- 1. PRINTEN (driverless) ---
    - name: Installeer CUPS en moderne driverless printing
      ansible.builtin.apt:
        name:
          - cups
          - avahi-daemon      # mDNS discovery voor netwerkprinters
          - ipp-usb           # Driverless printing voor USB-printers
          - system-config-printer
        state: present

    - name: Zorg dat CUPS draait
      ansible.builtin.systemd:
        name: cups
        state: started
        enabled: true

    - name: Zorg dat Avahi draait (netwerkprinterdetectie)
      ansible.builtin.systemd:
        name: avahi-daemon
        state: started
        enabled: true

    # --- 2. BLUETOOTH GUI ---
    - name: Installeer Blueman
      ansible.builtin.apt:
        name: blueman
        state: present

    # --- 3. MEDIA ---
    - name: Installeer VLC
      ansible.builtin.apt:
        name:
          - vlc
          - vlc-l10n
        state: present

    # --- 4. WACHTWOORDKLUIS ---
    - name: Installeer KeePassXC
      ansible.builtin.apt:
        name: keepassxc
        state: present

    # --- 5. SCREENSHOTS ---
    - name: Installeer Flameshot
      ansible.builtin.apt:
        name: flameshot
        state: present

    # --- 6. ARCHIEF-GUI ---
    - name: Installeer File Roller
      ansible.builtin.apt:
        name: file-roller
        state: present
