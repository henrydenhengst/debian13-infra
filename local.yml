---
# FreeBoot Debian 13 / Cinnamon: installer-chroot and normal systemd operation.
# The preseed supplies -e ansible_is_chroot=true; the timer supplies false.
# Repository files/ are required for MOTD, Firefox and apt policy.
#
# Play order matters: the ansible-pull timer is installed FIRST, so a failure
# in a later play never leaves a machine without its daily retry.

- name: FreeBoot periodic ansible-pull updates
  hosts: localhost
  connection: local
  become: true
  gather_facts: false
  module_defaults:
    ansible.builtin.apt:
      lock_timeout: 300
  vars:
    desktop_user: freeboot
    ansible_is_chroot: false
    pull_repo_url: https://github.com/henrydenhengst/debian13-infra.git
    pull_branch: main
    pull_playbook: local.yml
    pull_on_calendar: daily
  tasks:
    - name: Ensure Ansible is available for future updates
      ansible.builtin.apt:
        name:
          - ansible
          - git
          - ca-certificates
          - python3-apt
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Create pull systemd service
      ansible.builtin.copy:
        content: |
          [Unit]
          Description=FreeBoot configuration refresh
          Wants=network-online.target
          After=network-online.target
          [Service]
          Type=oneshot
          TimeoutStartSec=3h
          Environment=HOME=/root
          Environment=ANSIBLE_LOCAL_TEMP=/root/.ansible/tmp
          ExecStart=/usr/bin/ansible-pull -U {{ pull_repo_url }} -C {{ pull_branch }} -i localhost, -e desktop_user={{ desktop_user }} -e ansible_is_chroot=false {{ pull_playbook }}
        dest: /etc/systemd/system/ansible-pull.service
        owner: root
        group: root
        mode: '0644'
      register: pull_service

    - name: Create pull systemd timer
      ansible.builtin.copy:
        content: |
          [Unit]
          Description=FreeBoot daily Ansible-pull
          [Timer]
          OnBootSec=15min
          OnCalendar={{ pull_on_calendar }}
          Persistent=true
          RandomizedDelaySec=30min
          [Install]
          WantedBy=timers.target
        dest: /etc/systemd/system/ansible-pull.timer
        owner: root
        group: root
        mode: '0644'
      register: pull_timer

    - name: Reload systemd manager on running system
      ansible.builtin.systemd_service:
        daemon_reload: true
      when: not (ansible_is_chroot | bool) and (pull_service.changed or pull_timer.changed)

    - name: Enable periodic update timer
      ansible.builtin.systemd_service:
        name: ansible-pull.timer
        enabled: true
        state: "{{ 'started' if not (ansible_is_chroot | bool) else omit }}"


- name: FreeBoot Debian 13 baseline
  hosts: localhost
  connection: local
  become: true
  gather_facts: true
  module_defaults:
    ansible.builtin.apt:
      lock_timeout: 300
  vars:
    desktop_user: freeboot
    ansible_is_chroot: false
  tasks:
    - name: Install baseline packages
      ansible.builtin.apt:
        name:
          - curl
          - htop
          - unattended-upgrades
          - git
          - firefox-esr
          - anacron
          - sudo
          - ca-certificates
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Install FreeBoot MOTD
      ansible.builtin.copy:
        src: files/motd.txt
        dest: /etc/motd
        owner: root
        group: root
        mode: '0644'

    - name: Create Firefox policies directory
      ansible.builtin.file:
        path: /etc/firefox/policies
        state: directory
        mode: '0755'

    - name: Install Firefox policies
      ansible.builtin.copy:
        src: files/firefox/policies.json
        dest: /etc/firefox/policies/policies.json
        mode: '0644'

    - name: Configure automatic upgrades
      ansible.builtin.copy:
        src: files/apt/52unattended-upgrades-local
        dest: /etc/apt/apt.conf.d/52unattended-upgrades-local
        mode: '0644'
      register: upgrade_policy

    - name: Restart upgrade timers if policy changed
      ansible.builtin.systemd_service:
        name: '{{ item }}'
        state: restarted
      loop:
        - apt-daily.timer
        - apt-daily-upgrade.timer
      when: upgrade_policy.changed and not (ansible_is_chroot | bool)


- name: FreeBoot hardware support and diagnostics
  hosts: localhost
  connection: local
  become: true
  gather_facts: true
  module_defaults:
    ansible.builtin.apt:
      lock_timeout: 300
  vars:
    desktop_user: freeboot
    ansible_is_chroot: false
    hw_report_max_age: 2592000
    hw_report_path: '/home/{{ desktop_user }}/FreeBoot-hardware-rapport.txt'
  tasks:
    - name: Ensure Debian deb822 sources file exists
      ansible.builtin.stat:
        path: /etc/apt/sources.list.d/debian.sources
      register: sources_file

    - name: Check classic sources.list
      ansible.builtin.stat:
        path: /etc/apt/sources.list
      register: classic_sources_file

    - name: Enable non-free firmware components in deb822 sources
      ansible.builtin.replace:
        path: /etc/apt/sources.list.d/debian.sources
        regexp: '(?m)^Components:.*$'
        replace: 'Components: main contrib non-free non-free-firmware'
      when: sources_file.stat.exists
      register: repo_changed

    - name: Enable additional components for classic sources.list
      ansible.builtin.replace:
        path: /etc/apt/sources.list
        regexp: '(?m)^(deb(?:\s+\[[^]]+\])?\s+\S+\s+\S+)\s+main(?:\s+.*)?$'
        replace: '\1 main contrib non-free non-free-firmware'
      when: not sources_file.stat.exists and classic_sources_file.stat.exists
      register: classic_repo_changed

    - name: Refresh package lists after repository updates
      ansible.builtin.apt:
        update_cache: true
      when: (repo_changed is changed) or (classic_repo_changed is changed)

    - name: Install Intel microcode only on Intel CPUs
      ansible.builtin.apt:
        name: intel-microcode
        state: present
      when: ansible_facts['processor'] | join(' ') is search('GenuineIntel')

    - name: Install AMD microcode only on AMD CPUs
      ansible.builtin.apt:
        name: amd64-microcode
        state: present
      when: ansible_facts['processor'] | join(' ') is search('AuthenticAMD')

    - name: Install firmware, device tools and diagnostics
      ansible.builtin.apt:
        name:
          - firmware-misc-nonfree
          - firmware-iwlwifi
          - firmware-brcm80211
          - firmware-realtek
          - firmware-atheros
          - firmware-amd-graphics
          - firmware-sof-signed
          - bluez-firmware
          - bluetooth
          - mesa-utils
          - va-driver-all
          - xserver-xorg-input-libinput
          - alsa-utils
          - guvcview
          - v4l-utils
          - ntfs-3g
          - exfatprogs
          - pcscd
          - pcsc-tools
          - opensc
          - lshw
          - smartmontools
          - inxi
          - upower
          - mokutil
          - dmidecode
        state: present

    - name: Install Intel thermal management
      ansible.builtin.apt:
        name: thermald
        state: present
      when: ansible_facts['processor'] | join(' ') is search('GenuineIntel')

    - name: Enable smartcard daemon
      ansible.builtin.systemd_service:
        name: pcscd.socket
        enabled: true
        state: "{{ 'started' if not (ansible_is_chroot | bool) else omit }}"

    - name: Detect laptop batteries
      ansible.builtin.find:
        paths: /sys/class/power_supply
        file_type: link
        patterns: 'BAT*'
      register: batteries

    - name: Install TLP on laptops
      ansible.builtin.apt:
        name:
          - tlp
          - tlp-rdw
        state: present
      when: batteries.matched | int > 0

    - name: Remove conflicting laptop power daemon
      ansible.builtin.apt:
        name: power-profiles-daemon
        state: absent
      when: batteries.matched | int > 0

    - name: Enable TLP on laptops
      ansible.builtin.systemd_service:
        name: tlp
        enabled: true
        state: "{{ 'started' if not (ansible_is_chroot | bool) else omit }}"
      when: batteries.matched | int > 0

    - name: Ensure hardware access groups exist
      ansible.builtin.group:
        name: '{{ item }}'
        state: present
      loop:
        - video
        - lp
        - plugdev
        - bluetooth
        - audio

    - name: Add desktop user to hardware groups
      ansible.builtin.user:
        name: '{{ desktop_user }}'
        groups: video,lp,plugdev,bluetooth,audio
        append: true

    - name: Determine whether diagnostics need refreshing
      ansible.builtin.stat:
        path: '{{ hw_report_path }}'
      register: hardware_report

    # The installer chroot has no running systemd/upower/dmesg access, so the
    # report is only meaningful on the real system (first timer run).
    - name: Decide whether to write the hardware report
      ansible.builtin.set_fact:
        hw_report_due: >-
          {{ not (ansible_is_chroot | bool) and
             (not hardware_report.stat.exists or
              ((ansible_date_time.epoch | int) - (hardware_report.stat.mtime | default(0) | int)) > (hw_report_max_age | int)) }}

    - name: Collect hardware diagnostics
      ansible.builtin.shell: |
        {
          echo '=== FreeBoot hardware report ==='
          date -Is
          for entry in 'Battery:upower -e' 'Clock:timedatectl' 'Time sync:journalctl -b 0 -u systemd-timesyncd --no-pager' 'Storage:lsblk -o NAME,SIZE,TYPE,MODEL' 'SMART:smartctl --scan' 'Kernel:dmesg --level=err,warn' 'BIOS:dmidecode -t bios' 'Secure Boot:mokutil --sb-state' 'System:inxi -Fxz' 'Hardware:lshw'; do
            name=${entry%%:*}; cmd=${entry#*:}
            printf '\n=== %s ===\n' "$name"
            $cmd 2>&1 || true
          done
          for battery in $(upower -e 2>/dev/null | grep battery || true); do
            echo "=== Battery details $battery ==="
            upower -i "$battery" 2>&1 || true
          done
          for disk in $(lsblk -dpno NAME,TYPE | awk '$2=="disk" {print $1}'); do
            echo "=== SMART $disk ==="
            smartctl -H -A "$disk" 2>&1 || true
          done
        } > {{ hw_report_path }}
      args:
        executable: /bin/bash
      changed_when: true
      when: hw_report_due | bool

    - name: Set report ownership
      ansible.builtin.file:
        path: '{{ hw_report_path }}'
        owner: '{{ desktop_user }}'
        group: '{{ desktop_user }}'
        mode: '0600'
      when: hw_report_due | bool


- name: FreeBoot Cinnamon desktop and protection
  hosts: localhost
  connection: local
  become: true
  gather_facts: true
  module_defaults:
    ansible.builtin.apt:
      lock_timeout: 300
  vars:
    ansible_is_chroot: false
    wallpaper_url: https://freeboot.nl/images/wallpaper.webp
    wallpaper_dest: /usr/share/backgrounds/freeboot/wallpaper.webp
    # Safer default: SSH stays closed. Set -e ufw_allow_ssh=true to open port 22.
    ufw_allow_ssh: false
  tasks:
    - name: Select LightDM before installation
      ansible.builtin.debconf:
        name: lightdm
        question: shared/default-x-display-manager
        vtype: select
        value: /usr/sbin/lightdm

    - name: Install Cinnamon, display manager, audio and multimedia
      ansible.builtin.apt:
        name:
          - xserver-xorg
          - xinit
          - lightdm
          - slick-greeter
          - cinnamon
          - cinnamon-l10n
          - network-manager
          - network-manager-gnome
          - gnome-terminal
          - nemo
          - gvfs-fuse
          - gstreamer1.0-plugins-good
          - pipewire
          - pipewire-audio
          - wireplumber
          - pavucontrol
        state: present

    # The installer may leave the NIC in /etc/network/interfaces (ifupdown),
    # which makes NetworkManager list it as "unmanaged". Keep loopback only.
    - name: Check for ifupdown interfaces file
      ansible.builtin.stat:
        path: /etc/network/interfaces
      register: ifupdown_file

    - name: Hand network interfaces over to NetworkManager
      ansible.builtin.copy:
        content: |
          # Managed by FreeBoot Ansible: NetworkManager handles all other interfaces.
          source /etc/network/interfaces.d/*

          auto lo
          iface lo inet loopback
        dest: /etc/network/interfaces
        owner: root
        group: root
        mode: '0644'
        backup: true
      when: ifupdown_file.stat.exists

    - name: Create LightDM configuration directory
      ansible.builtin.file:
        path: /etc/lightdm/lightdm.conf.d
        state: directory
        mode: '0755'

    - name: Select slick-greeter
      ansible.builtin.copy:
        content: |
          [Seat:*]
          greeter-session=slick-greeter
        dest: /etc/lightdm/lightdm.conf.d/50-slick-greeter.conf
        mode: '0644'

    - name: Install fonts and office suite
      ansible.builtin.apt:
        name:
          - fonts-dejavu
          - fonts-noto
          - fonts-liberation
          - fonts-crosextra-carlito
          - fonts-crosextra-caladea
          - libreoffice
          - libreoffice-gtk3
          - libreoffice-l10n-nl
          - evince
        state: present

    - name: Accept Microsoft fonts license
      ansible.builtin.debconf:
        name: ttf-mscorefonts-installer
        question: msttcorefonts/accepted-mscorefonts-eula
        vtype: boolean
        value: 'true'

    # Optional and download-dependent: skipped in the installer chroot and
    # cleaned up if the postinst fails, so dpkg never stays half-configured.
    - name: Attempt optional Microsoft core fonts
      ansible.builtin.apt:
        name: ttf-mscorefonts-installer
        state: present
      register: msfonts_install
      ignore_errors: true
      when: not (ansible_is_chroot | bool)

    - name: Repair dpkg state if Microsoft fonts failed
      ansible.builtin.command: dpkg --configure -a
      changed_when: false
      failed_when: false
      when: msfonts_install is failed

    - name: Purge broken Microsoft fonts package (retried on next run)
      ansible.builtin.apt:
        name: ttf-mscorefonts-installer
        state: absent
        purge: true
      failed_when: false
      when: msfonts_install is failed

    - name: Install command line, archive and security tools
      ansible.builtin.apt:
        name:
          - vim
          - wget
          - zip
          - unzip
          - 7zip
          - xz-utils
          - zstd
          - cabextract
          - arj
          - lhasa
          - apparmor
          - apparmor-profiles
          - apparmor-utils
          - ufw
          - fwupd
          - timeshift
          - gnome-keyring
          - libpam-gnome-keyring
        state: present

    - name: Enable AppArmor
      ansible.builtin.systemd_service:
        name: apparmor
        enabled: true
        state: "{{ 'started' if not (ansible_is_chroot | bool) else omit }}"

    - name: Default-deny inbound traffic
      community.general.ufw:
        default: deny
        direction: incoming
      when: not (ansible_is_chroot | bool)

    - name: Default-allow outbound traffic
      community.general.ufw:
        default: allow
        direction: outgoing
      when: not (ansible_is_chroot | bool)

    - name: Permit SSH before enabling firewall
      community.general.ufw:
        rule: allow
        port: '22'
        proto: tcp
      when: ufw_allow_ssh | bool and not (ansible_is_chroot | bool)

    - name: Enable firewall on running system
      community.general.ufw:
        state: enabled
      when: not (ansible_is_chroot | bool)

    - name: Preconfigure incoming firewall policy for boot
      ansible.builtin.lineinfile:
        path: /etc/default/ufw
        regexp: '^DEFAULT_INPUT_POLICY='
        line: 'DEFAULT_INPUT_POLICY="DROP"'
      when: ansible_is_chroot | bool

    - name: Preconfigure SSH firewall rule for boot
      ansible.builtin.command: ufw allow 22/tcp
      changed_when: false
      when: ufw_allow_ssh | bool and ansible_is_chroot | bool

    - name: Enable firewall at first boot
      ansible.builtin.lineinfile:
        path: /etc/ufw/ufw.conf
        regexp: '^ENABLED='
        line: 'ENABLED=yes'
      when: ansible_is_chroot | bool

    - name: Install needrestart after first boot
      ansible.builtin.apt:
        name: needrestart
        state: present
      when: not (ansible_is_chroot | bool)

    - name: Configure noninteractive needrestart
      ansible.builtin.copy:
        content: "$nrconf{restart} = 'a';\n"
        dest: /etc/needrestart/conf.d/50-autorestart.conf
        mode: '0644'
      when: not (ansible_is_chroot | bool)

    - name: Enable LightDM
      ansible.builtin.systemd_service:
        name: lightdm
        enabled: true

    - name: Install dconf and WebP image support
      ansible.builtin.apt:
        name:
          - dconf-cli
          - webp-pixbuf-loader
        state: present

    - name: Create wallpaper directory
      ansible.builtin.file:
        path: /usr/share/backgrounds/freeboot
        state: directory
        mode: '0755'

    - name: Download FreeBoot wallpaper if reachable
      ansible.builtin.get_url:
        url: '{{ wallpaper_url }}'
        dest: '{{ wallpaper_dest }}'
        mode: '0644'
        timeout: 20
        force: true
      register: wallpaper_download
      failed_when: false

    - name: Create dconf profile directory
      ansible.builtin.file:
        path: /etc/dconf/profile
        state: directory
        mode: '0755'

    - name: Create system dconf profile
      ansible.builtin.copy:
        content: |
          user-db:user
          system-db:local
        dest: /etc/dconf/profile/user
        mode: '0644'

    - name: Create dconf database directory
      ansible.builtin.file:
        path: /etc/dconf/db/local.d
        state: directory
        mode: '0755'

    - name: Configure Cinnamon wallpaper default
      ansible.builtin.copy:
        content: |
          [org/cinnamon/desktop/background]
          picture-uri='file://{{ wallpaper_dest }}'
          picture-options='zoom'
        dest: /etc/dconf/db/local.d/00-wallpaper
        mode: '0644'
      register: wallpaper_settings

    - name: Refresh dconf database
      ansible.builtin.command: dconf update
      when: wallpaper_settings.changed

    - name: Configure greeter wallpaper
      ansible.builtin.copy:
        content: |
          [Greeter]
          background={{ wallpaper_dest }}
        dest: /etc/lightdm/slick-greeter.conf
        mode: '0644'


- name: FreeBoot daily applications
  hosts: localhost
  connection: local
  become: true
  gather_facts: true
  module_defaults:
    ansible.builtin.apt:
      lock_timeout: 300
  vars:
    ansible_is_chroot: false
  tasks:
    - name: Install printing, media and user applications
      ansible.builtin.apt:
        name:
          - cups
          - avahi-daemon
          - ipp-usb
          - system-config-printer
          - blueman
          - vlc
          - vlc-l10n
          - keepassxc
          - flameshot
          - file-roller
          - firefox-esr-l10n-nl
          - hunspell-nl
          - hyphen-nl
          - mythes-nl
          - thunderbird
          - thunderbird-l10n-nl
          - simple-scan
          - sane-airscan
          - flatpak
        state: present

    - name: Enable printer and discovery services
      ansible.builtin.systemd_service:
        name: '{{ item }}'
        enabled: true
        state: "{{ 'started' if not (ansible_is_chroot | bool) else omit }}"
      loop:
        - cups
        - avahi-daemon

    # Optional third-party repository: a Signal outage must not abort the run.
    - name: Signal Desktop (amd64 only, best effort)
      when: ansible_architecture == 'x86_64'
      block:
        - name: Install signing utilities
          ansible.builtin.apt:
            name: gnupg
            state: present

        - name: Download Signal key
          ansible.builtin.get_url:
            url: https://updates.signal.org/desktop/apt/keys.asc
            dest: /tmp/signal-desktop-keys.asc
            mode: '0644'
            timeout: 30

        - name: Convert Signal key to keyring
          ansible.builtin.command:
            cmd: gpg --batch --yes --dearmor --output /usr/share/keyrings/signal-desktop-keyring.gpg /tmp/signal-desktop-keys.asc
            creates: /usr/share/keyrings/signal-desktop-keyring.gpg

        - name: Install Signal repository definition
          ansible.builtin.get_url:
            url: https://updates.signal.org/static/desktop/apt/signal-desktop.sources
            dest: /etc/apt/sources.list.d/signal-desktop.sources
            mode: '0644'
            timeout: 30
          register: signal_repository

        - name: Refresh apt after Signal repository change
          ansible.builtin.apt:
            update_cache: true
          when: signal_repository is changed

        - name: Install Signal Desktop
          ansible.builtin.apt:
            name: signal-desktop
            state: present
      rescue:
        - name: Report Signal failure and continue
          ansible.builtin.debug:
            msg: "Signal Desktop skipped this run; it will be retried on the next ansible-pull."

    - name: Add Flathub on running system
      community.general.flatpak_remote:
        name: flathub
        flatpakrepo_url: https://dl.flathub.org/repo/flathub.flatpakrepo
        state: present
      when: not (ansible_is_chroot | bool)

    - name: Autoremove obsolete packages
      ansible.builtin.apt:
        autoremove: true
        autoclean: true
